<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taking a break – QuietNet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="blocked-page">
  <main class="blocked-card">
    <div class="blocked-icon" id="icon"></div>
    <h1 id="title">Site paused</h1>
    <p id="message"></p>
    <p class="blocked-site" id="site"></p>
    <div class="blocked-actions">
      <button class="btn btn-outline" id="goBack">Close tab</button>
      <button class="btn btn-outline" id="snooze">5 more minutes</button>
      <button class="btn btn-primary" id="endFocus" hidden>End Focus Mode</button>
    </div>
  </main>
  <script src="shared.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
